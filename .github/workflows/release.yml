name: Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/release.yml]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build launcher
        shell: powershell
        run: .\build.ps1
      - name: Test
        run: |
          python -m py_compile external_bridge.py mcp_server/sigil_mcp.py sigil_plugin/SigilMCPBridge/plugin.py
          python test_external_bridge.py
      - name: Package
        run: python package_release.py
      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create v0.2.0
          dist/Sigil-MCP-Bridge_v0.2.0.zip
          dist/SigilMCPBridge_v0.2.0.zip
          --title "Sigil MCP Bridge 0.2.0"
          --notes-file CHANGELOG.md
